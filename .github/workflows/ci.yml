name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Root .kiro and LICENSE present
        run: test -d .kiro && test -f LICENSE
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: '22'
      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Typecheck
        if: hashFiles('package.json') != ''
        run: npm run typecheck
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Playwright (serves dist with vite preview via playwright.config.ts)
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14